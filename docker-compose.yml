name: timavo

services:
  app:
    image: ghcr.io/nrso2018/timavo:${TIMAVO_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: >-
        Host=db;Port=5432;Database=Timavo;Username=postgres;
        Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      IdentityServer__Authority: ${IdentityServer__Authority:?set IdentityServer__Authority in .env}
    ports:
      - "${TIMAVO_PORT:-8080}:8080"
    volumes:
      - timavo-keys:/keys

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: Timavo
    volumes:
      - timavo-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Timavo"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  timavo-keys:
  timavo-data:
