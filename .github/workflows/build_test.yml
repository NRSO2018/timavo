name: Build & Test

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Timavo.sln

      - name: Build
        run: dotnet build Timavo.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Timavo.sln --configuration Release --no-build --verbosity normal
